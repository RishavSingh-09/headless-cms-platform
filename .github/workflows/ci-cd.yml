name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, uat, prod]
        default: dev

env:
  REGISTRY: docker.io
  DOCKER_USER: rishavsingh09
  BACKEND_IMAGE: rishavsingh09/cms-backend
  FRONTEND_IMAGE: rishavsingh09/cms-frontend
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.service }}/package.json
      - run: npm install
        working-directory: apps/${{ matrix.service }}
      - run: npm test
        working-directory: apps/${{ matrix.service }}

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          load: true

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          load: true

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Docker Hub login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}

  deploy-dev:
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cms-dev --region ${{ env.AWS_REGION }}
      - name: Helm deploy
        run: |
          helm upgrade --install cms infrastructure/helm/cms-platform \
            -f infrastructure/helm/cms-platform/environments/dev.yaml \
            --set backend.image.tag=${{ needs.build-and-scan.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build-and-scan.outputs.image_tag }} \
            --namespace cms --create-namespace --wait --timeout 10m

  deploy-uat:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'uat'
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: uat   # Requires GitHub environment reviewers
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - run: aws eks update-kubeconfig --name cms-uat --region ${{ env.AWS_REGION }}
      - run: |
          helm upgrade --install cms infrastructure/helm/cms-platform \
            -f infrastructure/helm/cms-platform/environments/uat.yaml \
            --set backend.image.tag=${{ needs.build-and-scan.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build-and-scan.outputs.image_tag }} \
            --namespace cms --create-namespace --wait --timeout 10m

  deploy-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: prod  # Requires GitHub environment reviewers
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - run: aws eks update-kubeconfig --name cms-prod --region ${{ env.AWS_REGION }}
      - run: |
          helm upgrade --install cms infrastructure/helm/cms-platform \
            -f infrastructure/helm/cms-platform/environments/prod.yaml \
            --set backend.image.tag=${{ needs.build-and-scan.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build-and-scan.outputs.image_tag }} \
            --namespace cms --create-namespace --wait --timeout 10m
