apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  labels:
    app: {{ .Values.backend.name }}
    environment: {{ .Values.global.environment }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels: { app: {{ .Values.backend.name }} }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: {{ .Values.backend.name }} }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "1337"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: cms-db-secret, key: password }
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.backend.service.port }} }
            initialDelaySeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.backend.service.port }} }
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}
spec:
  type: {{ .Values.backend.service.type }}
  selector: { app: {{ .Values.backend.name }} }
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
