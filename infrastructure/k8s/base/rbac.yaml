apiVersion: v1
kind: ServiceAccount
metadata:
  name: cms-app-sa
  namespace: cms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cms-app-role
  namespace: cms
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cms-app-rb
  namespace: cms
subjects:
  - kind: ServiceAccount
    name: cms-app-sa
    namespace: cms
roleRef:
  kind: Role
  name: cms-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cms-developer
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "pods/log", "deployments", "services"]
    verbs: ["get", "list", "watch"]
